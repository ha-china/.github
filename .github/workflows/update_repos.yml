name: Update Organization Repo List

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Repo List
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ha-china
        run: |
          python << 'EOF'
          import os
          import requests
          import re

          org = os.environ["ORG_NAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          repos = []
          page = 1

          while True:
              url = f"https://api.github.com/orgs/{org}/repos?per_page=100&page={page}"
              r = requests.get(url, headers=headers)
              data = r.json()

              if not data:
                  break

              repos.extend(data)
              page += 1

          repos = [
              r for r in repos
              if not r["fork"]
              and not r["archived"]
              and not r["private"]
          ]

          repos.sort(
              key=lambda x: x["stargazers_count"],
              reverse=True
          )

          lines = []
          lines.append("| Project | Description | Stars |")
          lines.append("|---|---|---|")

          for repo in repos:
              name = repo["name"]
              desc = repo["description"] or ""
              stars = repo["stargazers_count"]
              url = repo["html_url"]

              desc = desc.replace("\n", " ").replace("|", "\\|")

              lines.append(
                  f"| [{name}]({url}) | {desc} | ⭐ {stars} |"
              )

          content = "\n".join(lines)

          readme_path = ".github/profile/README.md"

          with open(readme_path, "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- repo-list-start -->.*?<!-- repo-list-end -->"

          replacement = (
              "<!-- repo-list-start -->\n"
              + content +
              "\n<!-- repo-list-end -->"
          )

          new_readme = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.S
          )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(new_readme)

          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/profile/README.md

          git diff --cached --quiet || git commit -m "Auto update repo list"

          git push
